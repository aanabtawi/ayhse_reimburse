<style>
:root{--ink:#16202A;--slate:#5C6B79;--faint:#8A97A3;--line:#E3E7EB;--hair:#EDF0F2;--surface:#fff;--base:#F3F5F7;--teal:#0E5A6B;--teal-ink:#0A4450;--green:#1F7A52;--green-bg:#EAF5EF;--amber:#9A6700;--amber-bg:#FBF3E2;--red:#B42318;--red-bg:#FBEEEC;}
*{box-sizing:border-box}

.attach{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;background:#FAFBFC}
.attach.missing{border-left:3px solid var(--amber)}.attach.ok{border-left:3px solid var(--green)}
.thumb{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:#fff;cursor:pointer}

.verdict{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:11px 13px}
.vtop.match{background:var(--green-bg)}.vtop.review{background:var(--amber-bg)}.vtop.flagged{background:var(--red-bg)}
.stamp{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.08em;border:2px solid currentColor;border-radius:6px;padding:3px 9px;transform:rotate(-3deg)}
.stamp.match{color:var(--green)}.stamp.review{color:var(--amber)}.stamp.flagged{color:var(--red)}
.vbody{padding:11px 13px;background:#fff;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair);border-radius:8px;overflow:hidden;margin-bottom:9px}
.cmp>div{padding:8px 10px}.cmp .l{border-right:1px solid var(--hair);background:#FAFBFC}
.cmp-k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.cmp-v{font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:2px}
.flagline{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--hair)}
.notebar{display:flex;gap:8px;align-items:flex-start;background:#FAFBFC;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:7px;padding:10px 12px;font-size:12.5px;color:var(--slate);margin-top:14px}
.notebar b{color:var(--ink)}
.poltag{display:inline-flex;align-items:center;gap:6px;background:var(--hair);border-radius:20px;padding:4px 6px 4px 11px;font-size:12px;margin:0 6px 6px 0}
.poltag button{border:none;background:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;color:var(--slate);font-weight:700;line-height:1}
.foot{font-size:12px;color:var(--faint);margin-top:8px}.hide{display:none!important}
.login{max-width:380px;margin:90px auto;text-align:center}
.login .card{text-align:left}
@media(max-width:620px){.cmp{grid-template-columns:1fr}.cmp .l{border-right:none;border-bottom:1px solid var(--hair)}}
</style>

<div id="app"></div>

<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DEFAULT_POLICY = ["Alcohol","Tobacco / vape","Gift cards","Cash back / ATM","Lottery","Late fees & interest"];
const S = {
  user:null, isReviewer:false, role:"submit", intakeMsg:"",
  txs:[], claimed:{}, receipts:{}, submitterName:"", sources:[],
  inbox:[], openSub:null, verifs:{}, decideUI:{key:null,mode:null,text:""}, rsec:{need:true,appr:false,sent:false,decl:false},
  mine:[], fix:{}, openMine:null,
  ledger:[], paid:[], policy:[...DEFAULT_POLICY],
  batches:[], batchSel:{}, wireOpen:null, wireRef:""
};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"$"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const uid=()=>Math.random().toString(36).slice(2,10);
const MONEY=/\d{1,3}(?:,\d{3})*\.\d{2}/g,REF=/\b(S\d{15,}|P0\d{11,})\b/,CARD=/Card\s+(\d{4})/i;
function parseLine(raw){const line=raw.replace(/\s+/g," ").trim();if(!line)return null;const dm=line.match(/^(\d{1,2}\/\d{1,2})\b/);if(!dm)return null;const moneys=line.match(MONEY);if(!moneys)return null;const amount=parseFloat(moneys[moneys.length-1].replace(/,/g,""));const ref=(line.match(REF)||[])[1]||"",card=(line.match(CARD)||[])[1]||"";const credit=/(Deposit|Online Transfer From|WT Fed|Purchase Return|Refund)/i.test(line);let m=line.replace(/^\d{1,2}\/\d{1,2}\s+/,"").replace(/(Purchase authorized on|Recurring Payment authorized on)\s+\d{1,2}\/\d{1,2}\s+/i,"").replace(REF,"").replace(/Card\s+\d{4}/i,"").replace(MONEY,"").replace(/\s{2,}/g," ").trim().replace(/\s+(CA|TX|WA|NJ|IL|DE|NY|CO)\s*$/,"").trim();return {id:uid(),date:dm[1],amount,ref,card,type:credit?"credit":"debit",merchant:(m||"(unlabeled)").slice(0,60)};}
function parseStatementText(text){const lines=text.split(/\r?\n/),joined=[];for(const ln of lines){if(/^\s*\d{1,2}\/\d{1,2}\b/.test(ln)||joined.length===0)joined.push(ln);else joined[joined.length-1]+=" "+ln;}return joined.map(parseLine).filter(Boolean).filter(t=>t.type==="debit");}
function dedupKey(t){return t.ref?"ref:"+t.ref:"h:"+[t.date,Number(t.amount).toFixed(2),(t.merchant||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,14)].join("|");}
// soft "possible duplicate": same amount, near date, similar vendor — but NOT an exact-code match
function _dnum(s){const m=/(\d{1,2})\/(\d{1,2})/.exec(s||"");return m?(+m[1])*31+(+m[2]):null;}
function itemSort(a,b){const da=_dnum(a.date),db=_dnum(b.date);if(da!=null&&db!=null&&da!==db)return da-db;if(da==null&&db!=null)return 1;if(da!=null&&db==null)return -1;const ma=(a.merchant||"").toLowerCase(),mb=(b.merchant||"").toLowerCase();if(ma<mb)return -1;if(ma>mb)return 1;return a.txId<b.txId?-1:a.txId>b.txId?1:0;}
function _dateClose(a,b){const x=_dnum(a),y=_dnum(b);if(x==null||y==null)return true;return Math.abs(x-y)<=10;}
function nearDupOf(item,ledger){
  const k=dedupKey(item), amt=Number(item.amount).toFixed(2);
  const im=(item.merchant||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  for(const r of (ledger||[])){
    if(r.key===k) continue;                              // exact match is the hard block, handled elsewhere
    if(Number(r.amount).toFixed(2)!==amt) continue;      // amounts must match to the cent
    const rm=(r.merchant||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const a=im.slice(0,4), b=rm.slice(0,4);
    const merchSim=a&&b&&(a===b||im.startsWith(b)||rm.startsWith(a));
    if(merchSim&&_dateClose(item.date,r.date)) return r;
  }
  return null;
}
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("read"));r.readAsDataURL(file);});}
function isHeic(file){return /heic|heif/i.test(file.type||"")||/\.(heic|heif)$/i.test(file.name||"");}
function shrinkImage(file){return new Promise(async res=>{if(file.type==="application/pdf"){res({media:"application/pdf",data:await readB64(file),name:file.name});return;}let src=file;if(isHeic(file)&&window.heic2any){try{const out=await heic2any({blob:file,toType:"image/jpeg",quality:0.85});src=Array.isArray(out)?out[0]:out;}catch(e){}}const url=URL.createObjectURL(src);const img=new Image();img.onload=()=>{const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res({media:"image/jpeg",data:c.toDataURL("image/jpeg",0.72).split(",")[1],name:file.name});URL.revokeObjectURL(url);};img.onerror=async()=>res({media:(src.type&&!/heic|heif/i.test(src.type))?src.type:"image/jpeg",data:await readB64(src),name:file.name});img.src=url;});}

/* ---------- AI via Edge Function ---------- */
async function callAI(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(AI_FUNCTION_URL,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token,"apikey":SUPABASE_ANON},body:JSON.stringify(body)});
  const t=await r.text(); return JSON.parse(t);
}

/* ---------- data layer (Supabase) ---------- */
function mapItem(r){const arr=Array.isArray(r.receipts)&&r.receipts.length?r.receipts.map(x=>({media:x.media,data:x.data})):(r.receipt_data?[{media:r.receipt_media,data:r.receipt_data}]:[]);return {txId:r.id,date:r.tx_date,merchant:r.merchant,amount:Number(r.amount),ref:r.ref||"",card:r.card||"",note:r.note||"",decision:r.decision||null,reason:r.decline_reason||"",verification:r.verification||null,receipts:arr,receipt:arr[0]||null};}
async function dbLedger(){const{data}=await sb.from("ledger").select("*");return(data||[]).map(r=>({key:r.dedup_key,date:r.tx_date,merchant:r.merchant,amount:Number(r.amount),ref:r.ref,approvedAt:(r.approved_at||"").slice(0,10),from:r.approved_by||"",batchId:r.batch_id||null,paidAt:r.paid_at||null}));}
async function dbBatches(){const{data}=await sb.from("batches").select("*").order("created_at",{ascending:false});return(data||[]).map(b=>({id:b.id,at:b.created_at,by:b.created_by||"",wiredAt:b.wired_at||null,ref:b.wire_ref||"",note:b.note||""}));}
async function dbCreateBatch(keys){const{data:b,error}=await sb.from("batches").insert({created_by:S.user.email}).select().single();if(error)throw error;const{error:e2}=await sb.from("ledger").update({batch_id:b.id}).in("dedup_key",keys);if(e2)throw e2;return b;}
async function dbMarkWired(batchId,ref){const t=new Date().toISOString();const{error}=await sb.from("batches").update({wired_at:t,wire_ref:ref||null}).eq("id",batchId);if(error)throw error;const{error:e2}=await sb.from("ledger").update({paid_at:t}).eq("batch_id",batchId);if(e2)throw e2;}
async function dbCancelBatch(batchId){await sb.from("ledger").update({batch_id:null}).eq("batch_id",batchId).is("paid_at",null);await sb.from("batches").delete().eq("id",batchId);}
async function dbLoadPolicy(){try{const{data}=await sb.from("app_settings").select("value").eq("key","flag_list").maybeSingle();return (data&&Array.isArray(data.value)&&data.value.length)?data.value:[...DEFAULT_POLICY];}catch(e){return [...DEFAULT_POLICY];}}
async function dbSavePolicy(arr){try{await sb.from("app_settings").upsert({key:"flag_list",value:arr,updated_at:new Date().toISOString()},{onConflict:"key"});}catch(e){}}
async function dbInbox(){const{data}=await sb.from("submissions").select("id,submitter,submitted_by,created_at,status,sources,items(*)").order("created_at",{ascending:false});return(data||[]).map(s=>({id:s.id,by:s.submitter,owner:s.submitted_by,at:s.created_at,status:s.status,sources:s.sources||[],items:(s.items||[]).map(mapItem).sort(itemSort)}));}
async function dbMine(){const{data}=await sb.from("submissions").select("id,submitter,submitted_by,created_at,status,sources,items(*)").eq("submitted_by",S.user.id).order("created_at",{ascending:false});return(data||[]).map(s=>({id:s.id,by:s.submitter,owner:s.submitted_by,at:s.created_at,status:s.status,sources:s.sources||[],items:(s.items||[]).map(mapItem).sort(itemSort)}));}
async function dbSubmit(name,items,sources){
  const{data:sub,error}=await sb.from("submissions").insert({submitter:name,submitted_by:S.user.id,sources:sources||[]}).select().single();
  if(error)throw error;
  const rows=items.map(it=>({submission_id:sub.id,tx_date:it.date,merchant:it.merchant,amount:it.amount,ref:it.ref,card:it.card,note:it.note||"",dedup_key:dedupKey(it),receipts:it.receipts||[],receipt_data:(it.receipts&&it.receipts[0])?it.receipts[0].data:null,receipt_media:(it.receipts&&it.receipts[0])?it.receipts[0].media:null}));
  const{error:e2}=await sb.from("items").insert(rows);
  if(e2)throw e2;
}
async function dbSaveVerification(itemId,v){await sb.from("items").update({verification:v}).eq("id",itemId);}
async function dbDecide(item,sub,d,reason){
  await sb.from("items").update({decision:d,decline_reason:reason||null,decided_at:new Date().toISOString(),decided_by:S.user.email}).eq("id",item.txId);
  if(d==="approved"){
    await sb.from("ledger").upsert({dedup_key:dedupKey(item),tx_date:item.date,merchant:item.merchant,amount:item.amount,ref:item.ref,approved_by:S.user.email,submission_id:sub.id},{onConflict:"dedup_key",ignoreDuplicates:true});
  }
  // "final" = every item is approved or hard-declined (a returned item is back with the submitter)
  const final=sub.items.every(i=>{const dd=i.txId===item.txId?d:i.decision;return dd==="approved"||dd==="declined";});
  await sb.from("submissions").update({status:final?"reviewed":"open"}).eq("id",sub.id);
}
// submitter re-attaches a receipt to a returned item and sends it back into review
async function dbResend(item){
  // keep decline_reason: it becomes the "you'd asked for…" note the reviewer sees on the resubmission
  await sb.from("items").update({decision:null,verification:null,decided_at:null,decided_by:null,receipts:item.receipts||[],receipt_data:(item.receipts&&item.receipts[0])?item.receipts[0].data:null,receipt_media:(item.receipts&&item.receipts[0])?item.receipts[0].media:null}).eq("id",item.txId);
  await sb.from("submissions").update({status:"open"}).eq("id",item.subId);
}

function seenStore(){try{return JSON.parse(localStorage.getItem("reimb_seen")||"[]");}catch(e){return [];}}
function markSeen(sig){try{const a=seenStore();if(!a.includes(sig)){a.push(sig);localStorage.setItem("reimb_seen",JSON.stringify(a.slice(-300)));}}catch(e){}}
function pkgComplete(s){return s.items.length>0&&s.items.every(i=>i.decision);}
function pkgSig(s){return s.id+":"+s.items.map(i=>i.decision||"-").join(",");}
function pkgNeedsBadge(s){return pkgComplete(s)&&!seenStore().includes(pkgSig(s));}
function openMinePkg(id){S.openMine=id;const s=S.mine.find(x=>x.id===id);if(s&&pkgComplete(s))markSeen(pkgSig(s));renderSubmit();}
function closeMinePkg(){S.openMine=null;renderSubmit();}
function mineListHTML(){
  return `<p class="lead">Grouped by submission — tap one to see its charges.</p>
  ${S.mine.map(s=>{const a=s.items.filter(i=>i.decision==="approved").length,r=s.items.filter(i=>i.decision==="returned").length,d=s.items.filter(i=>i.decision==="declined").length,p=s.items.filter(i=>!i.decision).length;const badge=pkgNeedsBadge(s);const status=p?`Pending — ${s.items.length-p}/${s.items.length} reviewed`:(r?`${r} sent back — needs you`:"Reviewed");const tone=p?"slate":(r?"amber":"green");const parts=[a?a+" approved":"",r?r+" sent back":"",d?d+" declined":"",p?p+" pending":""].filter(Boolean).join(" · ");return `<button class="pkgrow" onclick="openMinePkg('${s.id}')">
    <div style="min-width:0"><div class="merch">${esc((s.at||"").slice(0,10))} · ${s.items.length} charge${s.items.length===1?"":"s"} · ${fmt(s.items.reduce((x,i)=>x+i.amount,0))}</div><div class="sub" style="margin-top:2px">${parts}</div></div>
    <div style="flex:0 0 auto;display:flex;align-items:center;gap:8px">${badge?'<span class="dot" title="Reviewed since you last looked"></span>':""}<span class="tag ${tone}">${status}</span><span class="chev">›</span></div></button>`;}).join("")}`;
}
function mineDetailHTML(){

  return `<div class="btnrow" style="margin-top:0"><button class="btn ghost sm" onclick="closeMinePkg()">← All submissions</button></div>
  <div class="sub mono" style="margin:9px 0 6px">${esc((s.at||"").slice(0,16).replace("T"," "))} · ${s.items.length} charge${s.items.length===1?"":"s"} · ${fmt(s.items.reduce((x,i)=>x+i.amount,0))}</div>

      ${st==="declined"?`<div class="sub" style="color:var(--red);margin-top:3px">Declined${it.reason?": "+esc(it.reason):""} — start a new request to retry.</div>`:""}</div>
    <div class="att-amt amt">${fmt(it.amount)}</div>
    <div style="flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      ${st==="approved"?'<span class="tag green">approved</span>':st==="declined"?'<span class="tag red">declined</span>':st==="returned"?'<span class="tag amber">sent back</span>':'<span class="tag slate">pending</span>'}
      ${st==="returned"?`<label class="rdrop" style="min-width:118px" ondragover="dz(event,1)" ondragleave="dz(event,0)" ondrop="dropFix(event,'${it.txId}')"><input type="file" accept="image/*,.heic,.heif,application/pdf" style="display:none" onchange="attachFix('${it.txId}',this.files[0])"><span class="rdrop-ic">⬇</span><span class="rdrop-t">${fixN?fixN+" new — add more":"New receipt"}</span></label><button class="btn teal sm" onclick="resend('${s.id}','${it.txId}')">Resend</button>`:""}
    </div></div>`;}).join("")}`;
}
function dz(e,on){e.preventDefault();e.currentTarget.classList.toggle("drag",!!on);}
function dropIntake(e){e.preventDefault();e.currentTarget.classList.remove("drag");const files=e.dataTransfer&&e.dataTransfer.files;if(files&&files.length)intakeFiles(files);}
function clearIntake(){S.txs=[];S.claimed={};S.receipts={};S.sources=[];S.intakeMsg="";renderSubmit();}
// parse one PDF statement; return its charge rows AND the original file (for the reviewer to see)
async function parsePdfFile(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text="";for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const c=await page.getTextContent();const rows={};c.items.forEach(it=>{const y=Math.round(it.transform[5]);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str});});Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{text+=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ")+"\n";});}const b64=await readB64(file);return {rows:parseStatementText(text),source:{kind:"pdf",media:"application/pdf",data:b64,name:file.name||"statement.pdf"}};}
// OCR one charge screenshot; return its charge rows AND the (shrunk) original image
async function ocrImageFile(file){const sh=await shrinkImage(file);const rows=await callAI({action:"ocr",fileData:sh.data,media:sh.media});return {rows:(rows||[]).map(x=>({id:uid(),date:x.date||"",amount:parseFloat(x.amount)||0,ref:x.ref||"",card:x.card||"",type:"debit",merchant:(x.merchant||"(unlabeled)").slice(0,60)})),source:{kind:"image",media:sh.media,data:sh.data,name:file.name||"screenshot"}};}
// one pass over a mixed batch of PDFs + screenshots, merged into the charge list
async function intakeFiles(fileList){
  const files=[...fileList]; if(!files.length) return;
  const isPdf=f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");
  const pdfs=files.filter(isPdf), imgs=files.filter(f=>!isPdf(f));
  const m=$("intakeMsg"); if(m) m.textContent=`Reading ${[pdfs.length?pdfs.length+" PDF":"",imgs.length?imgs.length+" image"+(imgs.length===1?"":"s"):""].filter(Boolean).join(" and ")}…`;
  let found=[], errs=0;
  for(const f of pdfs){ try{ const out=await parsePdfFile(f); found=found.concat(out.rows); S.sources.push(out.source); }catch(e){ errs++; } }
  for(const f of imgs){ try{ const out=await ocrImageFile(f); found=found.concat(out.rows); S.sources.push(out.source); }catch(e){ errs++; } }
  if(!found.length){ S.intakeMsg = errs?"Couldn't read those files — try a clearer screenshot or the PDF.":"No charges found in those files."; renderSubmit(); return; }
  const seen=new Set(S.txs.map(t=>dedupKey(t))); let added=0, dups=0;
  for(const t of found){ const k=dedupKey(t); if(seen.has(k)){ dups++; continue; } seen.add(k); S.txs.push(t); added++; }
  S.intakeMsg = `Added ${added} charge${added===1?"":"s"}.`+(dups?` ${dups} already in the list.`:"")+(errs?` ${errs} file${errs===1?"":"s"} couldn't be read.`:"");
  renderSubmit();
}
function toggleClaim(id){S.claimed[id]=!S.claimed[id];renderSubmit();}
function toggleAll(on){const paidSet=new Set((S.paid||[]).map(p=>p.key));S.txs.forEach(t=>{if(!paidSet.has(dedupKey(t)))S.claimed[t.id]=on;});renderSubmit();}
function dropReceipt(e,id){e.preventDefault();e.currentTarget.classList.remove("drag");const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)attachReceipt(id,f);}
async function attachFix(id,file){if(!file)return;const sh=await shrinkImage(file);if(!S.fix[id])S.fix[id]=[];S.fix[id].push({media:sh.media,data:sh.data});renderSubmit();}
function dropFix(e,id){e.preventDefault();e.currentTarget.classList.remove("drag");const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)attachFix(id,f);}
async function resend(subId,itemId){
  const sub=S.mine.find(s=>s.id===subId);const it=sub&&sub.items.find(i=>i.txId===itemId);if(!it)return;
  const fixFiles=S.fix[itemId]||[];
  const receipts=fixFiles.length?fixFiles.map(f=>({media:f.media,data:f.data})):(it.receipts||[]);
  const updated=Object.assign({},it,{subId:subId,receipts:receipts});
  try{ await dbResend(updated); }catch(e){ alert("Resend failed: "+(e.message||e)); return; }
  delete S.fix[itemId]; S.mine=await dbMine(); renderSubmit();
}
function setNote(id,v){const r=S.receipts[id]||{files:[]};r.note=v;S.receipts[id]=r;}
async function attachReceipt(id,file){if(!file)return;const sh=await shrinkImage(file);const r=S.receipts[id]||{files:[]};if(!r.files)r.files=[];r.files.push({media:sh.media,data:sh.data,name:sh.name});S.receipts[id]=r;renderSubmit();}
function removeReceipt(id,idx){const r=S.receipts[id];if(!r||!r.files)return;r.files.splice(idx,1);renderSubmit();}
async function doSubmit(){
  const msg=$("submitMsg"); $("subBtn").disabled=true; msg.textContent="Submitting…";
  const items=S.txs.filter(t=>S.claimed[t.id]).map(t=>{const r=S.receipts[t.id]||{};const files=r.files||[];return {date:t.date,merchant:t.merchant,amount:t.amount,ref:t.ref,card:t.card,note:r.note||"",receipts:files.map(f=>({media:f.media,data:f.data}))};});
  try{ await dbSubmit(S.submitterName,items,S.sources); S.txs=[];S.claimed={};S.receipts={};S.sources=[]; S.mine=await dbMine(); renderSubmit(); $("submitMsg").textContent="Submitted — the reviewer will see it shortly."; }
  catch(e){ msg.textContent="Submit failed: "+(e.message||e); $("subBtn").disabled=false; }
}

/* ============================ REVIEW ============================ */
async function refreshInbox(){ S.inbox=await dbInbox(); S.ledger=await dbLedger(); S.batches=await dbBatches(); if(S.role==="review"&&!S.openSub) renderReviewHome(); }
async function refreshPaid(){ S.ledger=await dbLedger(); S.paid=S.ledger.map(r=>({key:r.key})); if(S.role==="submit") renderSubmit(); }
function renderReviewHome(){

  if(S.role==="review"&&S.isReviewer){const inbox=await dbInbox();const led=await dbLedger();const bat=await dbBatches();const sig=JSON.stringify(inbox.map(s=>[s.id,s.items.length,s.status,s.items.filter(i=>i.decision).length]))+"|"+JSON.stringify(led.map(r=>[r.key,r.batchId,r.paidAt]))+"|"+JSON.stringify(bat.map(b=>[b.id,b.wiredAt]));if(sig!==_inboxSig){_inboxSig=sig;S.inbox=inbox;S.ledger=led;S.batches=bat;if(!S.openSub&&!S.wireOpen)renderReviewHome();}}
  if(S.role==="submit"){const led=await dbLedger();const mine=await dbMine();const sig=JSON.stringify(led.map(r=>r.key))+"|"+JSON.stringify(mine.map(s=>s.items.map(i=>i.decision)));if(sig!==_paidSig){_paidSig=sig;S.ledger=led;S.paid=led.map(r=>({key:r.key}));S.mine=mine;renderSubmit();}}
}catch(e){} }
setInterval(poll,6000);

boot();
</script>
